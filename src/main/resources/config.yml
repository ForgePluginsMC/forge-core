# ForgeCore configuration
# MiniMessage formatting is supported in motd and message templates.

# Message of the day shown on join (blank to disable).
motd: "<gold>Welcome to the server, <white>%player_name%<gold>!"

# Currency symbol used by the economy.
currency-symbol: "$"
# Balance given to first-time players.
starting-balance: 100.0

# Seconds before an inactive player is marked AFK (0 to disable).
afk-seconds: 300
# Broadcast "<player> is now AFK" messages.
afk-broadcast: true

# Teleport request expiry in seconds.
tpa-timeout-seconds: 60

# Max homes per player (permission forgecore.home.unlimited bypasses).
max-homes: 5

# Teleport to the world spawn on first join.
first-spawn:
  teleport: true

# Warmup before /rtp and /spawn teleports (seconds, 0 to disable).
teleport-warmup-seconds: 0

# Enchantments disabled server-wide (namespaced keys, e.g. minecraft:sharpness).
disabled-enchants: []

# Exp levels charged per /repair (0 = free).
repair-cost-levels: 0

# Maintenance mode flag (toggled by /maintenance).
maintenance: false
# UUIDs that may join during maintenance.
maintenance-bypass: []

# Dynamic sign refresh interval in seconds.
dsign-interval-seconds: 30

# Animated tablist (merged from forge-tablist).
# Each header/footer frame is a LIST of MiniMessage lines.
# Placeholders: %player% %online% %max% %tps% plus %player_name%,
# %forgecore_balance%, %forgecore_playtime%, %forgecore_nick%, %forgecore_rank%.
tablist:
  header-frames:
    - - "<gradient:#ff7b2e:#ffb347><bold>ForgeCore</bold></gradient>"
      - "<gray>Welcome back, <white>%player%</white><gray>!"
    - - "<gradient:#ffb347:#ff7b2e><bold>ForgeCore</bold></gradient>"
      - "<gray><white>%online%</white> online <dark_gray>|</dark_gray> TPS <green>%tps%</green>"
  footer-frames:
    - - "<gray>playtime: <white>%forgecore_playtime%</white>  |  balance: <white>%forgecore_balance%</white>"
      - "<dark_gray>━━━━━━━━━━━━━━━"
  # Ticks between frame advances (100 = 5 seconds).
  interval-ticks: 100
  # Tab-list entry names. First matching permission wins; "" matches everyone.
  # Prefix + nick + suffix are parsed as ONE MiniMessage string.
  groups:
    - permission: ""
      prefix: "<gray>"
      suffix: "</gray>"
  # Animated server-list MOTD frames (each frame = list of lines).
  motd-frames:
    - - "<gradient:#ff7b2e:#ffb347><bold>ForgeCore</bold></gradient>"
      - "<gray>A ForgePlugins server"
  # Seconds between MOTD frame changes.
  motd-interval-seconds: 5
  # Override the player count shown in the server list (-1 to disable).
  motd-max-players: -1

# Rank ladder auto-promotion (see plugins/ForgeCore/ranks.yml).
ranks:
  auto: false

# Flight charges (see /flightcharge).
flightcharge:
  # Max charges a player can hold.
  max: 3600.0
  # Charges drained per minute of flight.
  drain-per-minute: 60.0
  # Charges granted per exp level via /flightcharge expcharge.
  exp-rate: 10.0
  # Charges granted per unit of currency via /flightcharge moneycharge.
  money-rate: 1.0
  # Currency cost per charge when using /flightcharge recharge.
  recharge-cost: 0.1

# Random teleport defaults per world (managed by /setrt).
rtp: {}
